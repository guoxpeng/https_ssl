# https_ssl —— 默认部署文件（推荐）
#
# 直接使用 Docker Hub 上已构建好的镜像，不编译源码，几十秒就能跑起来：
#   docker compose up -d
#
# 网络模式是 host，而且**只支持 host**：容器直接用宿主机网络，nginx 监听的
# 端口就是宿主机端口，所以面板里新增反向代理时端口填了即生效 —— 不用改这个文件，
# 也不用重建容器。
#
# 为什么不做 bridge：桥接模式的端口映射在容器创建时就固定了，用户在面板里填的端口
# 容器内 nginx 会监听，外面却连不上（必须先改 ports 再重建容器），非常容易踩坑。
#
# 代价：
#   1. 失去容器的网络隔离，容器与宿主机共用网络栈；
#   2. 仅 Linux 支持。Docker Desktop（macOS / Windows）没有 host 模式，
#      想在桌面上跑请用 Linux 虚拟机，或自行承担 bridge 下端口不通的风险；
#   3. 端口若已被宿主机上别的服务占用，nginx 会因为绑不上而加载失败
#      （已运行的站点不受影响，但新站点不生效）。
#
# 注意：host 模式下不能有 ports 段，Docker 会直接报错。
#
# 想自己改代码、从源码构建：改用 docker-compose.build.yml
# 想换镜像（比如用国内镜像加速站）：
#   在 .env 里写 QILIN_IMAGE=镜像地址:标签
services:
  qilin-ssl:
    image: ${QILIN_IMAGE:-nameguoguo/https_ssl:latest}
    container_name: qilin_ssl
    network_mode: host
    # 用 init 当 1 号进程，docker stop 时能正常转发信号、回收僵尸进程
    init: true
    volumes:
      - ./data/ca:/app/ca                       # 根证书
      - ./data/certs:/app/certs                 # 签发的证书
      - ./data/uploads:/app/uploads             # 上传文件
      - ./data/proxy:/app/proxy                 # 反向代理配置与证书
      - ./data:/app/data                        # 用户表等运行时状态
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - QILIN_PROXY_DIR=/app/proxy
      # 用户表放数据卷里，重建容器不会把改过的密码冲掉
      - QILIN_USERS_FILE=/app/data/users.json
      # host 模式没有端口映射，面板端口由这里决定（默认 2002）。
      # 想换端口：在 .env 里写 QILIN_PORT=你的端口
      - QILIN_PORT=${QILIN_PORT:-2002}
      # 管理员 admin 的初始密码，默认 admin。
      # 想换成别的：在 .env 里写 QILIN_ADMIN_PASSWORD=你的密码
      - QILIN_ADMIN_PASSWORD=${QILIN_ADMIN_PASSWORD:-admin}
      # 会话签名密钥；不设置时每次启动随机生成，重启会导致所有登录失效
      - QILIN_SECRET_KEY=${QILIN_SECRET_KEY:-}
      # 面板经 HTTPS 暴露时置 1，会话 Cookie 仅在 HTTPS 下发送
      - QILIN_COOKIE_SECURE=${QILIN_COOKIE_SECURE:-0}
    restart: always
