# https_ssl —— 桥接（bridge）网络模式
#
# 什么时候用它：
#   1. 在 macOS / Windows 上跑 Docker Desktop —— host 模式不被支持；
#   2. 需要保留容器网络隔离。
#
# 代价：端口映射在**容器创建时就固定了**，运行时加不了。每加一个反向代理端口，
# 都要先在下面的 ports 里声明，再 docker compose up -d 重建容器 ——
# 面板里填完端口不等于对外可用。
#
# 用法：
#   docker compose -f docker-compose.bridge.yml up -d
#
# 想自己改代码、从源码构建：把下面的 build 注释打开，并把 image 那行删掉，
# 然后 docker compose -f docker-compose.bridge.yml up -d --build
#
# 提示：在 Linux 上，默认的 docker-compose.yml（host 模式）用起来更省事，
#       反向代理端口填了即生效。
services:
  qilin-ssl:
    image: ${QILIN_IMAGE:-nameguoguo/https_ssl:latest}
    container_name: qilin_ssl
    # build: .
    ports:
      - "2002:2002"      # 管理面板
      - "14000:14000"    # 示例反向代理端口，按需增删
    init: true
    volumes:
      - ./data/ca:/app/ca                       # 根证书
      - ./data/certs:/app/certs                 # 签发的证书
      - ./data/uploads:/app/uploads             # 上传文件
      - ./data/proxy:/app/proxy                 # 反向代理配置与证书
      - ./data:/app/data                        # 用户表等运行时状态
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - QILIN_PROXY_DIR=/app/proxy
      # 用户表放数据卷里，重建容器不会把改过的密码冲掉
      - QILIN_USERS_FILE=/app/data/users.json
      # 桥接模式下容器内固定监听 2002，对外端口由上面的 ports 映射决定。
      # 这里写死是为了不让 .env 里的 QILIN_PORT 影响容器内的监听端口。
      - QILIN_PORT=2002
      # 管理员 admin 的初始密码，默认 admin。
      # 想换成别的：在 .env 里写 QILIN_ADMIN_PASSWORD=你的密码
      - QILIN_ADMIN_PASSWORD=${QILIN_ADMIN_PASSWORD:-admin}
      # 会话签名密钥；不设置时每次启动随机生成，重启会导致所有登录失效
      - QILIN_SECRET_KEY=${QILIN_SECRET_KEY:-}
      # 面板经 HTTPS 暴露时置 1，会话 Cookie 仅在 HTTPS 下发送
      - QILIN_COOKIE_SECURE=${QILIN_COOKIE_SECURE:-0}
    restart: always
